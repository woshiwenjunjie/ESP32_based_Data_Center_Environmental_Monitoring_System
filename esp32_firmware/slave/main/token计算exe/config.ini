; ============================================================
; OneNet Token 计算配置文件
; ============================================================
; 
; 【使用说明】
; 
; 本文件用于OneNet MQTT连接时的Token计算工具配置。
; Token是OneNet平台用于设备身份验证的安全凭证。
; 
; 【配置步骤】
; 
; 步骤1: 登录OneNet平台获取三要素
;   - 访问 https://open.iot.10086.cn/
;   - 进入 产品管理 → 设备管理 → 设备详情
;   - 获取产品ID、设备名称、设备密钥
; 
; 步骤2: 填写以下配置项
;   - res: 替换为您的产品ID和设备名称
;   - key: 替换为您的设备密钥
;   - et: 过期时间戳（Unix时间戳，单位秒）
; 
; 【参数说明】
; 
; res (resource) - 资源标识
;   格式: products/{产品ID}/devices/{设备名称}
;   示例: products/123456/devices/esp32_slave
; 
; et (expire time) - 过期时间戳
;   格式: Unix时间戳（秒）
;   获取: 访问 https://www.unixtimestamp.com/ 生成
;   建议: 设置为未来较长的时间，如2030年
; 
; key - 设备密钥
;   来源: OneNet平台设备详情页获取
;   注意: 这是敏感信息，请妥善保管
; 
; method - 签名方法
;   固定值: md5
; 
; od - 其他参数
;   固定值: md5
; 
; 【Token计算】
; 配置完成后，运行token计算工具生成Token字符串，
; 将生成的Token填入config.h中的DEVICE_SECRET字段。
; 
; 【安全提示】
; - 请勿将包含真实密钥的配置文件提交到公共仓库
; - 建议定期更换设备密钥
; - 过期时间建议设置较长，避免频繁更新

[info]
; 资源标识 - 替换为您的产品ID和设备名称
; 格式: products/{产品ID}/devices/{设备名称}
res = products/YOUR_PRODUCT_ID/devices/YOUR_DEVICE_NAME

; 过期时间戳 - Unix时间戳（秒），建议设置为2030年或更晚
; 获取方式: https://www.unixtimestamp.com/
et = YOUR_EXPIRE_TIME

; 设备密钥 - 从OneNet平台设备详情页获取
key = YOUR_DEVICE_KEY

; 签名方法 - 固定为md5，无需修改
method = md5

; 其他参数 - 固定为md5，无需修改
od = md5
